# shinservice (Duplo): шины и диски — обычно два XML; второй URL задаётся как wheels_url в suppliers.yaml.
# tire: width, profile, diam, brand, model, season, pin, load, speed, sku, photo, price, stock
# wheel: diameter (16/6.5J), pn, pcd, et, centerbore, type, color, sku, photo, price, stock
supplier_id: "supplier_3"
supplier_name: "shinservice"
item_xpath_tires: "//tires/tire"
item_xpath_wheels: "//wheels/wheel"

tires:
  field_mapping:
    SHIRINA_PROFILYA: "width"
    VYSOTA_PROFILYA: "profile"
    POSADOCHNYY_DIAMETR: "diam"
    PROIZVODITEL: "brand"
    SEZONNOST: "season"
    SHIPY: "pin"
    MORE_PHOTO: "photo"
    INDEKS_NAGRUZKI: "load"
    INDEKS_SKOROSTI: "speed"
    CML2_ARTICLE: "sku"
    MODEL_AVTOSHINY: "model"
    HOMOLOGATION: "homologation"
    OS_SUPPLIER_TEXT: "supplier"
    price: "price"
    quantity: "stock"
  value_transforms:
    SEZONNOST:
      w: "Зимняя"
      s: "Летняя"
      u: "Всесезонная"
      a: "Всесезонная"
    SHIPY:
      Y: "1"
      N: "0"

wheels:
  field_mapping:
    SHIRINA_DISKA: "diameter"
    POSADOCHNYY_DIAMETR_DISKA: "diameter"
    COUNT_OTVERSTIY: "pn"
    MEZHBOLTOVOE_RASSTOYANIE: "pcd"
    VYLET_DISKA: "et"
    DIAMETR_STUPITSY: "centerbore"
    MORE_PHOTO: "photo"
    CML2_ARTICLE: "sku"
    WHEEL_TYPE: "type"
    MODEL_DISKA: "model"
    OS_SUPPLIER_TEXT: "supplier"
    PROIZVODITEL: "brand"
    DISK_COLOR: "color"
    price: "price"
    quantity: "stock"
  value_transforms: {}
